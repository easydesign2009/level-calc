<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>현장 레벨 계산기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    /* 입력 숫자 화살표 가독성 및 터치 친화적 크기 확보 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 0.7;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-12">
  <div class="max-w-5xl mx-auto px-3 sm:px-6 pt-4 sm:pt-6 space-y-4">
    <!-- 상단 타이틀 및 공유/초기화 액션 바 -->
    <header class="bg-slate-900 text-white rounded-2xl p-4 sm:p-6 shadow-sm">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-amber-400/15 border border-amber-300/30 text-amber-300 text-xs font-semibold mb-2">
            <span>현장 레벨 측정 · 단차 자동 판정</span>
          </div>
          <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">레벨 계산기</h1>
          <p class="text-xs sm:text-sm text-slate-300 mt-1">
            기준점 대비 측정 레벨의 단차(<span class="font-semibold text-white">측정값 - 기준점</span>)와 작업 구분(<span class="text-amber-300 font-semibold">짤라</span> · <span class="text-sky-300 font-semibold">붙여</span> · <span class="text-emerald-300 font-semibold">놔둬</span>)을 즉시 계산합니다.
          </p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button
            type="button"
            onclick="copySummaryText()"
            class="px-3.5 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-slate-950 text-xs sm:text-sm font-bold transition shadow-sm active:scale-[0.99]"
          >
            요약 복사
          </button>
          <button
            type="button"
            onclick="exportCsv()"
            class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 text-xs sm:text-sm font-semibold transition active:scale-[0.99]"
          >
            CSV 저장
          </button>
          <button
            type="button"
            onclick="resetSampleData()"
            class="px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs sm:text-sm font-medium transition active:scale-[0.99]"
          >
            샘플 복원
          </button>
          <button
            type="button"
            onclick="clearAllMeasurements()"
            class="px-3.5 py-2.5 rounded-xl bg-rose-950/70 hover:bg-rose-900 text-rose-200 border border-rose-800/60 text-xs sm:text-sm font-medium transition active:scale-[0.99]"
          >
            측정값 비우기
          </button>
        </div>
      </div>

      <!-- 복사/안내 메시지 배너 -->
      <div id="statusBanner" class="hidden mt-3 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-emerald-500/20 border border-emerald-400/40 text-emerald-200"></div>
    </header>

    <!-- 현장 정보 + 기준점 설정 카드 -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
        <div>
          <label for="siteName" class="block text-xs font-bold text-slate-600 mb-1.5">
            현장명 (선택)
          </label>
          <input
            id="siteName"
            type="text"
            placeholder="예: ○○공원 진입로 포장"
            oninput="saveState(); renderAll();"
            class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm font-medium text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900"
          />
        </div>

        <div>
          <label for="measureDate" class="block text-xs font-bold text-slate-600 mb-1.5">
            측정 날짜 (선택)
          </label>
          <input
            id="measureDate"
            type="date"
            onchange="saveState(); renderAll();"
            class="w-full rounded-xl border border-slate-300 bg-white px-3.5 py-2.5 text-sm font-medium text-slate-900 tabular-nums focus:outline-none focus:ring-2 focus:ring-slate-900"
          />
        </div>

        <div class="sm:col-span-2 lg:col-span-2">
          <label for="referencePoint" class="block text-xs font-bold text-amber-900 mb-1.5">
            기준점 (기본값: 100)
          </label>
          <div class="flex items-center gap-2">
            <input
              id="referencePoint"
              type="number"
              step="any"
              value="100"
              oninput="handleRefChange()"
              class="w-full rounded-xl border-2 border-amber-400 bg-amber-50/60 px-4 py-2.5 text-base sm:text-lg font-extrabold text-slate-950 tabular-nums focus:outline-none focus:ring-2 focus:ring-amber-500"
            />
            <button
              type="button"
              onclick="setRefDefault()"
              class="px-3 py-2.5 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-950 text-xs font-bold shrink-0 transition"
              title="기준점을 100으로 설정"
            >
              100 고정
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- 실시간 요약 KPI 카드 4종 -->
    <section class="grid grid-cols-2 lg:grid-cols-4 gap-3">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm">
        <div class="text-xs font-semibold text-slate-500">입력 측점 수</div>
        <div class="flex items-baseline justify-between mt-1.5">
          <span id="kpiCount" class="text-2xl sm:text-3xl font-extrabold text-slate-900 tabular-nums">7</span>
          <span class="text-xs text-slate-400 tabular-nums">/ 40 측점</span>
        </div>
      </div>

      <div class="bg-amber-50 rounded-2xl border-2 border-amber-300 p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-amber-900">짤라 (측정 &lt; 기준)</span>
          <span class="px-2 py-0.5 rounded-full bg-amber-500 text-white text-[11px] font-extrabold">절토·깎기</span>
        </div>
        <div class="flex items-baseline justify-between mt-1.5">
          <span id="kpiCut" class="text-2xl sm:text-3xl font-extrabold text-amber-800 tabular-nums">2</span>
          <span class="text-xs font-semibold text-amber-700">건</span>
        </div>
      </div>

      <div class="bg-sky-50 rounded-2xl border-2 border-sky-300 p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-sky-900">붙여 (측정 &gt; 기준)</span>
          <span class="px-2 py-0.5 rounded-full bg-sky-600 text-white text-[11px] font-extrabold">성토·채우기</span>
        </div>
        <div class="flex items-baseline justify-between mt-1.5">
          <span id="kpiFill" class="text-2xl sm:text-3xl font-extrabold text-sky-800 tabular-nums">4</span>
          <span class="text-xs font-semibold text-sky-700">건</span>
        </div>
      </div>

      <div class="bg-emerald-50 rounded-2xl border-2 border-emerald-300 p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-emerald-900">놔둬 (측정 = 기준)</span>
          <span class="px-2 py-0.5 rounded-full bg-emerald-600 text-white text-[11px] font-extrabold">현상태 유지</span>
        </div>
        <div class="flex items-baseline justify-between mt-1.5">
          <span id="kpiKeep" class="text-2xl sm:text-3xl font-extrabold text-emerald-800 tabular-nums">1</span>
          <span class="text-xs font-semibold text-emerald-700">건</span>
        </div>
      </div>
    </section>

    <!-- 필터 바 및 측점 1~40 테이블 -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="p-4 sm:px-5 border-b border-slate-200 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="flex flex-wrap items-center gap-1.5" role="group" aria-label="결과 필터">
          <button
            type="button"
            data-filter="ALL"
            onclick="setFilter('ALL')"
            class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white transition"
          >
            전체 (40)
          </button>
          <button
            type="button"
            data-filter="CUT"
            onclick="setFilter('CUT')"
            class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-100 text-amber-900 hover:bg-amber-200 transition"
          >
            짤라만 보기
          </button>
          <button
            type="button"
            data-filter="FILL"
            onclick="setFilter('FILL')"
            class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-sky-100 text-sky-900 hover:bg-sky-200 transition"
          >
            붙여만 보기
          </button>
          <button
            type="button"
            data-filter="KEEP"
            onclick="setFilter('KEEP')"
            class="filter-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-100 text-emerald-900 hover:bg-emerald-200 transition"
          >
            놔둬만 보기
          </button>
        </div>

        <div class="flex items-center gap-2">
          <button
            type="button"
            onclick="focusNextEmptyRow()"
            class="px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 transition"
          >
            다음 빈 측점 이동
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-800 text-white text-xs sm:text-sm">
              <th class="py-3 px-3 sm:px-4 font-bold w-24 sm:w-28 text-center">측점</th>
              <th class="py-3 px-3 sm:px-4 font-bold w-40 sm:w-48">측정 레벨</th>
              <th class="py-3 px-3 sm:px-4 font-bold w-32 sm:w-36 text-right">단차</th>
              <th class="py-3 px-3 sm:px-4 font-bold w-32 sm:w-40 text-center">높낮음</th>
              <th class="py-3 px-3 sm:px-4 font-bold">현장 메모 (선택)</th>
            </tr>
          </thead>
          <tbody id="levelTableBody" class="divide-y divide-slate-200 text-sm">
            <!-- JavaScript로 1~40 측점 행 생성 -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- 공유/보고서용 요약 미리보기 박스 -->
    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-5">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-xs sm:text-sm font-bold text-slate-700">카톡 · 현장 보고서 요약 미리보기</h2>
        <button
          type="button"
          onclick="copySummaryText()"
          class="text-xs font-bold text-sky-700 hover:text-sky-900 underline"
        >
          텍스트 복사하기
        </button>
      </div>
      <pre
        id="summaryPreview"
        class="w-full rounded-xl bg-slate-50 border border-slate-200 p-3.5 text-xs sm:text-sm text-slate-800 whitespace-pre-wrap break-words leading-relaxed tabular-nums"
      ></pre>
    </section>
  </div>

  <script>
    // 엑셀 원본('레벌계산기(ver.20230413).xlsx') 기준 기본 상수 및 샘플 데이터
    const TOTAL_POINTS = 40;
    const DEFAULT_REF = 100;
    const SAMPLE_VALUES = {
      1: 80,
      2: 103,
      3: 100,
      4: 127,
      5: 90,
      6: 134,
      7: 120
    };

    const STORAGE_KEY = 'field_level_calculator_v1';

    let state = {
      siteName: '',
      measureDate: new Date().toISOString().slice(0, 10),
      referencePoint: DEFAULT_REF,
      filter: 'ALL',
      // 측점 1~40: { level: string, note: string }
      points: {}
    };

    function createSamplePoints() {
      const pts = {};
      for (let i = 1; i <= TOTAL_POINTS; i++) {
        pts[i] = {
          level: Object.prototype.hasOwnProperty.call(SAMPLE_VALUES, i) ? String(SAMPLE_VALUES[i]) : '',
          note: ''
        };
      }
      return pts;
    }

    function createEmptyPoints() {
      const pts = {};
      for (let i = 1; i <= TOTAL_POINTS; i++) {
        pts[i] = { level: '', note: '' };
      }
      return pts;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          state.points = createSamplePoints();
          return;
        }
        const parsed = JSON.parse(raw);
        state.siteName = typeof parsed.siteName === 'string' ? parsed.siteName : '';
        state.measureDate = typeof parsed.measureDate === 'string' ? parsed.measureDate : state.measureDate;
        state.referencePoint = Number.isFinite(Number(parsed.referencePoint)) && parsed.referencePoint !== ''
          ? Number(parsed.referencePoint)
          : DEFAULT_REF;
        state.filter = ['ALL', 'CUT', 'FILL', 'KEEP'].includes(parsed.filter) ? parsed.filter : 'ALL';

        const base = createEmptyPoints();
        for (let i = 1; i <= TOTAL_POINTS; i++) {
          if (parsed.points && parsed.points[i]) {
            base[i].level = parsed.points[i].level !== undefined && parsed.points[i].level !== null
              ? String(parsed.points[i].level)
              : '';
            base[i].note = typeof parsed.points[i].note === 'string' ? parsed.points[i].note : '';
          }
        }
        state.points = base;
      } catch (err) {
        console.error('상태 불러오기 오류:', err);
        state.points = createSamplePoints();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        // 스토리지 제한 환경에서는 무시
      }
    }

    function showBanner(message, isError = false) {
      const banner = document.getElementById('statusBanner');
      banner.textContent = message;
      banner.className = isError
        ? 'mt-3 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-rose-500/20 border border-rose-400/40 text-rose-200'
        : 'mt-3 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-medium bg-emerald-500/20 border border-emerald-400/40 text-emerald-200';
      banner.classList.remove('hidden');
      clearTimeout(window.__bannerTimer);
      window.__bannerTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2600);
    }

    // 부동소수점 오차(예: 103.3 - 100 = 3.3000000000000114) 정리
    function cleanNumber(num) {
      if (!Number.isFinite(num)) return 0;
      const rounded = Math.round(num * 1e6) / 1e6;
      return Object.is(rounded, -0) ? 0 : rounded;
    }

    function formatDiff(diff) {
      const val = cleanNumber(diff);
      if (val > 0) return `+${val}`;
      return `${val}`;
    }

    // 엑셀 로직:
    // 단차 = 측정값 - 기준점
    // 측정값 === 기준점 -> '놔둬'
    // 측정값 < 기준점  -> '짤라'
    // 측정값 > 기준점  -> '붙여'
    function evaluatePoint(rawLevelStr, refPoint) {
      if (rawLevelStr === '' || rawLevelStr === null || rawLevelStr === undefined) {
        return { hasInput: false, level: null, diff: null, actionCode: 'NONE', actionLabel: '-' };
      }
      const parsedLevel = Number(rawLevelStr);
      if (!Number.isFinite(parsedLevel)) {
        return { hasInput: false, level: null, diff: null, actionCode: 'NONE', actionLabel: '-' };
      }

      const diff = cleanNumber(parsedLevel - refPoint);
      if (diff === 0) {
        return { hasInput: true, level: parsedLevel, diff: 0, actionCode: 'KEEP', actionLabel: '놔둬' };
      }
      if (diff < 0) {
        return { hasInput: true, level: parsedLevel, diff, actionCode: 'CUT', actionLabel: '짤라' };
      }
      return { hasInput: true, level: parsedLevel, diff, actionCode: 'FILL', actionLabel: '붙여' };
    }

    function handleRefChange() {
      const input = document.getElementById('referencePoint');
      const val = input.value === '' ? DEFAULT_REF : Number(input.value);
      state.referencePoint = Number.isFinite(val) ? val : DEFAULT_REF;
      saveState();
      renderAll();
    }

    function setRefDefault() {
      state.referencePoint = DEFAULT_REF;
      document.getElementById('referencePoint').value = String(DEFAULT_REF);
      saveState();
      renderAll();
      showBanner('기준점을 100으로 설정했습니다.');
    }

    function handleLevelInput(index, value) {
      if (!state.points[index]) state.points[index] = { level: '', note: '' };
      state.points[index].level = value;
      saveState();
      updateRowAndSummary(index);
    }

    function handleNoteInput(index, value) {
      if (!state.points[index]) state.points[index] = { level: '', note: '' };
      state.points[index].note = value;
      saveState();
      buildSummaryPreview();
    }

    function setFilter(nextFilter) {
      state.filter = nextFilter;
      saveState();
      renderTable();
      updateFilterButtons();
    }

    function updateFilterButtons() {
      document.querySelectorAll('.filter-btn').forEach((btn) => {
        const isActive = btn.dataset.filter === state.filter;
        btn.classList.toggle('ring-2', isActive);
        btn.classList.toggle('ring-offset-1', isActive);
        btn.classList.toggle('ring-slate-900', isActive);
      });
    }

    function getBadgeHtml(actionCode, actionLabel) {
      if (actionCode === 'CUT') {
        return `<span class="inline-flex items-center justify-center px-3 py-1 rounded-full bg-amber-500 text-white text-xs sm:text-sm font-extrabold tracking-wide shadow-xs">${actionLabel}</span>`;
      }
      if (actionCode === 'FILL') {
        return `<span class="inline-flex items-center justify-center px-3 py-1 rounded-full bg-sky-600 text-white text-xs sm:text-sm font-extrabold tracking-wide shadow-xs">${actionLabel}</span>`;
      }
      if (actionCode === 'KEEP') {
        return `<span class="inline-flex items-center justify-center px-3 py-1 rounded-full bg-emerald-600 text-white text-xs sm:text-sm font-extrabold tracking-wide shadow-xs">${actionLabel}</span>`;
      }
      return `<span class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-400 text-xs font-semibold">미입력</span>`;
    }

    function getDiffClass(actionCode) {
      if (actionCode === 'CUT') return 'text-amber-700 font-extrabold';
      if (actionCode === 'FILL') return 'text-sky-700 font-extrabold';
      if (actionCode === 'KEEP') return 'text-emerald-700 font-extrabold';
      return 'text-slate-400 font-medium';
    }

    function updateRowAndSummary(index) {
      const pt = state.points[index] || { level: '', note: '' };
      const res = evaluatePoint(pt.level, state.referencePoint);

      const diffCell = document.getElementById(`diff-${index}`);
      const actionCell = document.getElementById(`action-${index}`);
      const rowEl = document.getElementById(`row-${index}`);

      if (diffCell) {
        diffCell.textContent = res.hasInput ? formatDiff(res.diff) : '-';
        diffCell.className = `py-2.5 px-3 sm:px-4 text-right tabular-nums text-sm sm:text-base ${getDiffClass(res.actionCode)}`;
      }
      if (actionCell) {
        actionCell.innerHTML = getBadgeHtml(res.actionCode, res.actionLabel);
      }
      if (rowEl) {
        rowEl.className = res.actionCode === 'CUT'
          ? 'bg-amber-50/40 hover:bg-amber-50/80 transition-colors'
          : res.actionCode === 'FILL'
          ? 'bg-sky-50/40 hover:bg-sky-50/80 transition-colors'
          : res.actionCode === 'KEEP'
          ? 'bg-emerald-50/40 hover:bg-emerald-50/80 transition-colors'
          : 'hover:bg-slate-50 transition-colors';
      }

      updateKpis();
      buildSummaryPreview();
    }

    function computeStats() {
      let inputCount = 0;
      let cutCount = 0;
      let fillCount = 0;
      let keepCount = 0;
      const items = [];

      for (let i = 1; i <= TOTAL_POINTS; i++) {
        const pt = state.points[i] || { level: '', note: '' };
        const res = evaluatePoint(pt.level, state.referencePoint);
        if (res.hasInput) {
          inputCount++;
          if (res.actionCode === 'CUT') cutCount++;
          else if (res.actionCode === 'FILL') fillCount++;
          else if (res.actionCode === 'KEEP') keepCount++;
        }
        items.push({ index: i, ...res, note: pt.note || '' });
      }

      return { inputCount, cutCount, fillCount, keepCount, items };
    }

    function updateKpis() {
      const stats = computeStats();
      document.getElementById('kpiCount').textContent = String(stats.inputCount);
      document.getElementById('kpiCut').textContent = String(stats.cutCount);
      document.getElementById('kpiFill').textContent = String(stats.fillCount);
      document.getElementById('kpiKeep').textContent = String(stats.keepCount);
    }

    function renderTable() {
      const tbody = document.getElementById('levelTableBody');
      const stats = computeStats();
      const filtered = stats.items.filter((item) => {
        if (state.filter === 'ALL') return true;
        return item.actionCode === state.filter;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="py-10 px-4 text-center text-sm text-slate-500">
              선택한 조건에 해당하는 측점이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      const fragment = document.createDocumentFragment();
      filtered.forEach((item) => {
        const tr = document.createElement('tr');
        tr.id = `row-${item.index}`;
        tr.className = item.actionCode === 'CUT'
          ? 'bg-amber-50/40 hover:bg-amber-50/80 transition-colors'
          : item.actionCode === 'FILL'
          ? 'bg-sky-50/40 hover:bg-sky-50/80 transition-colors'
          : item.actionCode === 'KEEP'
          ? 'bg-emerald-50/40 hover:bg-emerald-50/80 transition-colors'
          : 'hover:bg-slate-50 transition-colors';

        const escapedNote = item.note.replace(/"/g, '&quot;');
        const levelVal = item.hasInput ? String(item.level) : (state.points[item.index]?.level || '');

        tr.innerHTML = `
          <td class="py-2.5 px-3 sm:px-4 text-center font-bold text-slate-700 tabular-nums whitespace-nowrap">
            측점 ${item.index}
          </td>
          <td class="py-2.5 px-3 sm:px-4">
            <input
              id="level-${item.index}"
              type="number"
              step="any"
              inputmode="decimal"
              value="${levelVal}"
              placeholder="측정값 입력"
              oninput="handleLevelInput(${item.index}, this.value)"
              class="w-full rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm sm:text-base font-bold text-slate-900 tabular-nums focus:outline-none focus:ring-2 focus:ring-slate-900"
            />
          </td>
          <td id="diff-${item.index}" class="py-2.5 px-3 sm:px-4 text-right tabular-nums text-sm sm:text-base ${getDiffClass(item.actionCode)}">
            ${item.hasInput ? formatDiff(item.diff) : '-'}
          </td>
          <td id="action-${item.index}" class="py-2.5 px-3 sm:px-4 text-center whitespace-nowrap">
            ${getBadgeHtml(item.actionCode, item.actionLabel)}
          </td>
          <td class="py-2.5 px-3 sm:px-4">
            <input
              id="note-${item.index}"
              type="text"
              value="${escapedNote}"
              placeholder="메모"
              oninput="handleNoteInput(${item.index}, this.value)"
              class="w-full min-w-[110px] rounded-xl border border-slate-200 bg-white/90 px-3 py-2 text-xs sm:text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-400"
            />
          </td>
        `;
        fragment.appendChild(tr);
      });

      tbody.innerHTML = '';
      tbody.appendChild(fragment);
    }

    function buildSummaryText() {
      const stats = computeStats();
      const headerParts = ['[레벨 측정 요약]'];
      if (state.siteName.trim()) headerParts.push(`현장: ${state.siteName.trim()}`);
      if (state.measureDate) headerParts.push(`일자: ${state.measureDate}`);
      headerParts.push(`기준점: ${state.referencePoint}`);

      const lines = [
        headerParts.join(' | '),
        `입력 ${stats.inputCount}곳 | 짤라 ${stats.cutCount}건 · 붙여 ${stats.fillCount}건 · 놔둬 ${stats.keepCount}건`
      ];

      const entered = stats.items.filter((it) => it.hasInput);
      if (entered.length > 0) {
        const detailStr = entered
          .map((it) => {
            const notePart = it.note.trim() ? `(${it.note.trim()})` : '';
            return `${it.index}번: ${it.level} [${formatDiff(it.diff)} / ${it.actionLabel}]${notePart}`;
          })
          .join(', ');
        lines.push(detailStr);
      }

      return lines.join('\n');
    }

    function buildSummaryPreview() {
      document.getElementById('summaryPreview').textContent = buildSummaryText();
    }

    function copySummaryText() {
      const text = buildSummaryText();
      let copied = false;

      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        copied = document.execCommand('copy');
        document.body.removeChild(textarea);
      } catch (err) {
        copied = false;
      }

      if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(
          () => showBanner('요약 내용이 클립보드에 복사되었습니다.'),
          () => showBanner('복사할 내용을 아래 미리보기에서 직접 선택해 주세요.', true)
        );
        return;
      }

      if (copied) {
        showBanner('요약 내용이 클립보드에 복사되었습니다.');
      } else {
        showBanner('복사할 내용을 아래 미리보기에서 직접 선택해 주세요.', true);
      }
    }

    function exportCsv() {
      try {
        const stats = computeStats();
        const rows = [
          ['현장명', state.siteName || '', '측정날짜', state.measureDate || '', '기준점', String(state.referencePoint)],
          ['측점', '측정레벨', '단차', '높낮음', '메모']
        ];

        stats.items.forEach((it) => {
          rows.push([
            `측점 ${it.index}`,
            it.hasInput ? String(it.level) : '',
            it.hasInput ? formatDiff(it.diff) : '',
            it.hasInput ? it.actionLabel : '',
            it.note || ''
          ]);
        });

        const csvContent = rows
          .map((r) => r.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(','))
          .join('\r\n');

        // 한글 엑셀 깨짐 방지를 위한 UTF-8 BOM 추가
        const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const datePart = state.measureDate || 'level';
        link.href = url;
        link.download = `레벨계산기_${datePart}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showBanner('CSV 파일로 저장되었습니다.');
      } catch (err) {
        console.error('CSV 내보내기 오류:', err);
        showBanner('CSV 저장 중 오류가 발생했습니다.', true);
      }
    }

    function resetSampleData() {
      state.referencePoint = DEFAULT_REF;
      state.filter = 'ALL';
      state.points = createSamplePoints();
      document.getElementById('referencePoint').value = String(DEFAULT_REF);
      saveState();
      renderAll();
      showBanner('엑셀 기준 샘플 데이터(측점 1~7)로 복원했습니다.');
    }

    function clearAllMeasurements() {
      state.filter = 'ALL';
      state.points = createEmptyPoints();
      saveState();
      renderAll();
      showBanner('모든 측정값을 비웠습니다. 기준점은 유지됩니다.');
    }

    function focusNextEmptyRow() {
      if (state.filter !== 'ALL') {
        state.filter = 'ALL';
        renderTable();
        updateFilterButtons();
      }
      for (let i = 1; i <= TOTAL_POINTS; i++) {
        const raw = state.points[i]?.level ?? '';
        if (String(raw).trim() === '') {
          const input = document.getElementById(`level-${i}`);
          if (input) {
            input.scrollIntoView({ behavior: 'smooth', block: 'center' });
            input.focus();
          }
          return;
        }
      }
      showBanner('1~40번 측점이 모두 입력되었습니다.');
    }

    function renderAll() {
      document.getElementById('siteName').value = state.siteName;
      document.getElementById('measureDate').value = state.measureDate;
      document.getElementById('referencePoint').value = String(state.referencePoint);
      updateFilterButtons();
      renderTable();
      updateKpis();
      buildSummaryPreview();
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      renderAll();
    });
  </script>
</body>
</html>
