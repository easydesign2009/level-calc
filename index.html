<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>현장 레벨 계산기 (모바일)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    input, button {
      touch-action: manipulation;
    }
    .mobile-input {
      color: #0f172a !important;
      background-color: #ffffff !important;
      opacity: 1 !important;
      -webkit-text-fill-color: #0f172a !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-24">
  <!-- 모바일 스크롤 중에도 기준점과 요약 카운트를 보여주는 상단 고정 바 -->
  <div class="sticky top-0 z-30 bg-slate-900/95 backdrop-blur text-white border-b border-slate-700 px-3 py-2 shadow-md">
    <div class="max-w-xl mx-auto flex items-center justify-between gap-2 text-xs">
      <div class="flex items-center gap-1.5 shrink-0">
        <span class="text-slate-300 font-semibold">기준</span>
        <span id="stickyRef" class="px-2 py-0.5 rounded-md bg-amber-400 text-slate-950 font-extrabold tabular-nums">100</span>
      </div>
      <div class="flex items-center gap-2 font-extrabold tabular-nums">
        <span class="text-amber-300">짤라 <span id="stickyCut">2</span></span>
        <span class="text-sky-300">붙여 <span id="stickyFill">4</span></span>
        <span class="text-emerald-300">놔둬 <span id="stickyKeep">1</span></span>
      </div>
      <button
        type="button"
        onclick="shareReport()"
        class="px-2.5 py-1 rounded-lg bg-yellow-300 text-slate-950 font-extrabold shrink-0 active:scale-95"
      >
        카톡공유
      </button>
    </div>
  </div>

  <div class="max-w-xl mx-auto px-3 pt-3 space-y-3">
    <!-- 헤더 및 주요 액션 -->
    <header class="bg-slate-900 text-white rounded-2xl p-4 shadow-sm">
      <div class="flex items-center justify-between gap-2">
        <div>
          <span class="inline-block px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 text-[11px] font-bold mb-1">
            현장 모바일 전용
          </span>
          <h1 class="text-lg font-extrabold tracking-tight">레벨 계산기</h1>
        </div>
        <div class="text-right">
          <div class="text-[11px] text-slate-400">입력 측점</div>
          <div class="text-lg font-extrabold tabular-nums">
            <span id="kpiCount">7</span><span class="text-xs text-slate-400 font-normal"> / 40</span>
          </div>
        </div>
      </div>

      <p class="text-xs text-slate-300 mt-1.5">
        단차 = 측정값 - 기준점 · <span class="text-amber-300 font-bold">짤라</span>(&lt;0) · <span class="text-sky-300 font-bold">붙여</span>(&gt;0) · <span class="text-emerald-300 font-bold">놔둬</span>(=0)
      </p>

      <div class="grid grid-cols-4 gap-1.5 mt-3">
        <button
          type="button"
          onclick="shareReport()"
          class="py-2.5 px-2 rounded-xl bg-yellow-300 hover:bg-yellow-200 text-slate-950 text-xs font
